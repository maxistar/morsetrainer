[versions]
agp = "8.7.3"
junit = "4.13.2"
junitVersion = "1.3.0"
playServicesAnalytics = "17.0.1"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
androidxTestCoreUnit = "1.7.0"
espresso = "3.7.0"
androidxTestRunner = "1.7.0"
screengrab = "2.1.1"
androidxTestExtTruth = "1.7.0"

[libraries]

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
gms-analytics = { group = "com.google.android.gms", name = "play-services-analytics", version.ref = "playServicesAnalytics" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-test-core-unit = { group = "androidx.test", name = "core", version.ref = "androidxTestCoreUnit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
fastlane-screengrab = { group = "tools.fastlane", name = "screengrab", version.ref = "screengrab" }
androidx-test-ext-truth = { group = "androidx.test.ext", name = "truth", version.ref = "androidxTestExtTruth" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
